# =============================================================================
# 🏠 Kleinanzeigen Scraper - GitHub Actions Workflow (Playwright Edition)
# =============================================================================

name: Kleinanzeigen Scraper

on:
  schedule:
    # Alle 30 Minuten (GitHub plant in UTC!)
    - cron: '*/30 * * * *'
  
  # Manuelles Auslösen ermöglichen (für Tests & Debugging)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    # =======================================================================
    # Schritt 1: Code aus dem Repository auschecken
    # =======================================================================
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    # =======================================================================
    # Schritt 2: Python-Umgebung einrichten
    # =======================================================================
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # =======================================================================
    # Schritt 3: Python-Abhängigkeiten UND PLAYWRIGHT installieren
    # =======================================================================
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
        # 🔥 NEU & KRITISCH: Playwright Browser UND Linux-Systembibliotheken installieren
        # Ohne "install-deps" fehlt libnspr4.so und der Browser startet nicht!
        playwright install chromium
        playwright install-deps chromium

    # =======================================================================
    # Schritt 4: Cache für seen_ads.json laden
    # =======================================================================
    - name: ♻️ Restore seen_ads.json from cache
      uses: actions/cache@v4  # Auf v4 aktualisiert (neueste Version)
      with:
        path: seen_ads.json
        # OPTIMIERT: Statischer Key ist besser für Persistenz. 
        # Der alte Key mit run_id erzeugte bei jedem Run einen "neuen" Cache.
        key: ${{ runner.os }}-seen-ads
        restore-keys: |
          ${{ runner.os }}-seen-ads

    # =======================================================================
    # Schritt 5: Scraper ausführen
    # =======================================================================
    - name: ▶️ Run scraper
      env:
        KLEINANZEIGEN_URL: ${{ secrets.KLEINANZEIGEN_URL }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python scraper.py

    # =======================================================================
    # Schritt 6: Debug-Info (optional, aber hilfreich)
    # =======================================================================
    - name: 📊 Show cache status
      if: always()
      run: |
        echo "=== Cache Debug Info ==="
        echo "Runner OS: ${{ runner.os }}"
        echo "seen_ads.json exists: $([ -f seen_ads.json ] && echo 'YES' || echo 'NO')"
        if [ -f seen_ads.json ]; then
          echo "File size: $(wc -c < seen_ads.json) bytes"
        fi